<script type="text/babel" data-source="Shell.jsx">
const {SideRail,NavPills,Input,IconButton,Avatar,Wordmark}=window.AlugaDesignSystem_e4b917;
function useBreakpoint(){const get=()=>window.innerWidth<760?'m':window.innerWidth<1180?'t':'d';const [bp,setBp]=React.useState(get);React.useEffect(()=>{const f=()=>setBp(get());window.addEventListener('resize',f);return()=>window.removeEventListener('resize',f);},[]);return bp;}
const MODULES=[{id:'dash',label:'Painel',icon:'layout-grid'},{id:'props',label:'Imóveis',icon:'building-2'},{id:'maint',label:'Manutenção',icon:'wrench'},{id:'fin',label:'Financeiro',icon:'wallet'}];
function TopBar({bp,onLogout}){
  const user=window.ALUGA_DATA.user;
  if(bp==='m')return <header style={{display:'flex',alignItems:'center',gap:10,padding:'14px 16px 6px'}}><span style={{width:40,height:40,borderRadius:12,background:'var(--brand)',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:500,fontSize:18}}>A</span><Wordmark variant="spaced" size={15}/><span style={{flex:1}}></span><IconButton icon="message-circle" label="Mensagens" dot/><IconButton icon="bell" label="Notificações"/><button onClick={onLogout} style={{border:0,padding:0,background:'none',cursor:'pointer',borderRadius:'50%'}} title="Sair"><Avatar name={user.name} size={40}/></button></header>;
  return null;
}
function Shell({module,setModule,view,setView,onLogout,children}){
  const bp=useBreakpoint();const user=window.ALUGA_DATA.user;
  if(bp==='m')return <div style={{minHeight:'100vh',background:'var(--surface-page)',paddingBottom:96}}>
    <TopBar bp="m" onLogout={onLogout}/>
    <main style={{padding:'10px 16px 16px'}}>{children(bp)}</main>
    <div style={{position:'fixed',left:0,right:0,bottom:0,padding:'10px 16px 18px',display:'flex',justifyContent:'center',background:'linear-gradient(to top,var(--surface-page) 60%,rgba(244,244,248,0))',zIndex:20}}><NavPills compact bar items={MODULES} value={module} onChange={setModule} style={{width:'100%',maxWidth:420}}/></div>
  </div>;
  return <div style={{display:'grid',gridTemplateColumns:'88px minmax(0,1fr)',minHeight:'100vh',background:'var(--surface-page)'}}>
    <div style={{position:'sticky',top:0,height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',padding:'22px 0 20px',gap:28}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}><span style={{width:44,height:44,borderRadius:14,background:'var(--brand)',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:500,fontSize:19}}>A</span><Wordmark variant="spaced" size={9}/></div>
      <SideRail items={MODULES} value={module} onChange={setModule} style={{flex:1}} footer={<IconButton icon="log-out" label="Sair" variant="ghost" onClick={onLogout}/>}/>
    </div>
    <div style={{minWidth:0,display:'flex',flexDirection:'column'}}>
      <header style={{display:'flex',alignItems:'center',gap:14,padding:'20px 24px 16px 0',flexWrap:'wrap'}}>

        <Input icon="search" placeholder="Buscar imóvel, inquilino, contrato…" shortcut="⌘+K" style={{flex:1,minWidth:220,maxWidth:520,marginLeft:'auto'}}/>
        <div style={{display:'flex',gap:8,alignItems:'center'}}><IconButton icon="message-circle" label="Mensagens" dot/><IconButton icon="bell" label="Notificações"/>{bp==='d'&&<div style={{lineHeight:1.2,fontSize:13,textAlign:'right',marginLeft:6}}><div style={{color:'var(--text-strong)'}}>{user.name}</div><div style={{color:'var(--text-muted)',fontSize:12}}>{user.role}</div></div>}<Avatar name={user.name} size={44}/></div>
      </header>
      <main style={{padding:'0 24px 32px 0',minWidth:0}}>{children(bp)}</main>
    </div>
  </div>;
}
Object.assign(window,{Shell,useBreakpoint,MODULES});

</script>
<script type="text/babel" data-source="LoginScreen.jsx">

<script type="text/babel" data-source="PropertiesScreen.jsx">
(function(){
const {Card,CardHeader,DataTable,Badge,SegmentedControl,Input,Button,Dialog,Metric,Chip}=window.AlugaDesignSystem_e4b917;
function PropertiesScreen({bp,toast}){

  const rows=D.units.filter(u=>(f==='Todos'||u.status===f)&&(u.property+u.unit+u.tenant).toLowerCase().includes(q.toLowerCase()));
  const counts=s=>D.units.filter(u=>u.status===s).length;
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'grid',gridTemplateColumns:bp==='m'?'1fr 1fr':'repeat(4,minmax(0,1fr))',gap:14}}>{[['Ocupadas','Ocupado','78%'],['Livres','Livre','14%'],['Reservadas','Reservado','3%'],['Atrasadas','Atrasado','5%']].map(([l,s,p])=><Card key={l} onClick={()=>setF(s)} padding={18} style={{boxShadow:f===s?'inset 0 0 0 1.5px var(--brand)':undefined}}><CardHeader size="sm" title="Unidades" subtitle={l}/><Metric value={p} label={counts(s)+(counts(s)===1?' unidade':' unidades')} size="md" style={{marginTop:18}}/></Card>)}</div>

        {bp!=='m'&&<Button icon="plus" size="sm" onClick={()=>toast({tone:'info',title:'Cadastro de unidade',message:'Formulário aberto em nova aba (demo).'})}>Nova unidade</Button>}
      </div>
      {bp==='m'?<div style={{display:'flex',flexDirection:'column'}}>{rows.map(u=><button key={u.id} onClick={()=>setSel(u)} style={{display:'flex',alignItems:'center',gap:12,padding:'14px 2px',border:0,borderTop:'1px solid var(--border-subtle)',background:'none',textAlign:'left',font:'inherit',cursor:'pointer'}}><div style={{flex:1,minWidth:0}}><div style={{fontSize:14,color:'var(--text-strong)'}}>{u.property} · {u.unit}</div><div style={{fontSize:12,color:'var(--text-muted)'}}>{u.tenant}</div></div><div style={{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}><span style={{fontSize:14}}>{window.brl(u.rent)}</span><Badge size="sm" dot tone={window.STATUS_TONE[u.status]}>{u.status}</Badge></div></button>)}</div>
      :<DataTable onRowClick={setSel} columns={[{key:'u',label:'Unidade',render:r=><div><div style={{color:'var(--text-strong)'}}>{r.property} · {r.unit}</div><div style={{fontSize:12,color:'var(--text-muted)'}}>{r.type}</div></div>},{key:'tenant',label:'Inquilino'},{key:'due',label:'Vencimento'},{key:'rent',label:'Aluguel',align:'right',render:r=>window.brl(r.rent)},{key:'status',label:'Status',render:r=><Badge size="sm" dot tone={window.STATUS_TONE[r.status]}>{r.status}</Badge>}]} rows={rows}/>}
    </Card>
    <Dialog open={!!sel} onClose={()=>setSel(null)} width={520} title={sel?sel.property+' · '+sel.unit:''} subtitle={sel?sel.type:''} footer={<><Button variant="secondary" onClick={()=>setSel(null)}>Fechar</Button><Button icon="file-text" onClick={()=>{setSel(null);toast({title:'Contrato enviado',message:'Enviado para assinatura digital.'});}}>Enviar contrato</Button></>}>
      {sel&&<><div style={{height:170,borderRadius:22,overflow:'hidden'}}><img src="../../../assets/images/house-orange.png" alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>{[['Inquilino',sel.tenant],['Aluguel',window.brl(sel.rent)],['Vencimento',sel.due],['Status',<Badge dot tone={window.STATUS_TONE[sel.status]}>{sel.status}</Badge>]].map(([k,v])=><div key={k} style={{background:'var(--gray-50)',borderRadius:16,padding:'10px 14px'}}><div style={{fontSize:12,color:'var(--text-muted)'}}>{k}</div><div style={{fontSize:15,marginTop:2}}>{v}</div></div>)}</div></>}
    </Dialog>
  </div>;
}
window.PropertiesScreen=PropertiesScreen;
})();

</script>
<script type="text/babel" data-source="MaintenanceScreen.jsx">
(function(){
const {Card,CardHeader,ProgressPill,Badge,Button,AvatarGroup,Metric,SegmentedControl,IconButton}=window.AlugaDesignSystem_e4b917;
function MaintenanceScreen({bp,tasks,setTasks,onAddTask,toast}){
  const [f,setF]=React.useState('Abertas');
  const list=tasks.filter(t=>f==='Todas'||(f==='Abertas'?t.progress<100:t.progress===100));
  const done=id=>{setTasks(ts=>ts.map(t=>t.id===id?{...t,progress:100,tone:'dark',status:'Concluída'}:t));toast({title:'Tarefa concluída',message:'O inquilino foi notificado.'});};
  return <div style={{display:'grid',gridTemplateColumns:bp==='d'?'minmax(0,2fr) minmax(0,1fr)':'1fr',gap:14,alignItems:'start'}}>
    <Card>
      <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}><CardHeader title="Tarefas" subtitle="de manutenção" style={{marginRight:'auto'}}/><SegmentedControl size="sm" options={['Abertas','Concluídas','Todas']} value={f} onChange={setF}/><Button variant="dark" size="sm" icon="plus" onClick={onAddTask}>Adicionar</Button></div>
      <div style={{display:'flex',flexDirection:'column',marginTop:12}}>{list.map(t=><div key={t.id} style={{display:'flex',flexDirection:'column',gap:10,padding:'14px 0',borderTop:'1px solid var(--border-subtle)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}><div style={{flex:1,minWidth:160}}><div style={{color:'var(--text-strong)',fontSize:15}}>{t.title}</div><div style={{fontSize:12,color:'var(--text-muted)'}}>{t.where} · prazo {t.due}</div></div><Badge size="sm" dot tone={window.STATUS_TONE[t.status]||'neutral'}>{t.status}</Badge>{t.progress<100&&<IconButton icon="check" label="Concluir" size={34} onClick={()=>done(t.id)}/>}</div>
        <ProgressPill label={t.title} value={t.progress} tone={t.tone} people={t.people}/>
      </div>)}{list.length===0&&<div style={{padding:'30px 0',textAlign:'center',color:'var(--text-muted)',fontSize:14}}>Nenhuma tarefa neste filtro.</div>}</div>
    </Card>
    <div style={{display:'grid',gridTemplateColumns:bp==='t'?'1fr 1fr':'1fr',gap:14}}>
      <Card><CardHeader title="Desempenho da" subtitle="Manutenção"/><div style={{fontSize:14,color:'var(--text-muted)',margin:'12px 0 18px',lineHeight:1.45}}>Chamados, prestadores, prazos e andamento dos reparos em um só lugar.</div><Metric value="92%" label="Resolvidas no prazo" size="lg"/></Card>
      <Card tone="dark"><CardHeader inverse title="Chamados" subtitle="abertos"/><div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginTop:24}}><Metric inverse value={tasks.filter(t=>t.progress<100).length} label="em andamento"/><AvatarGroup people={[{name:'Ana Lima'},{name:'Caio Dias'},{name:'Felipe Sá'},{name:'Gabi Luz'}]} size={30}/></div></Card>
    </div>
  </div>;
}
window.MaintenanceScreen=MaintenanceScreen;
})();

</script>
<script type="text/babel" data-source="FinanceScreen.jsx">
(function(){
const {Card,CardHeader,Metric,LineChart,SegmentedControl,DataTable,Badge,Switch,Button,Legend}=window.AlugaDesignSystem_e4b917;
function FinanceScreen({bp,toast}){
  const D=window.ALUGA_DATA;const [r,setR]=React.useState('Mês');const [auto,setAuto]=React.useState(true);const [pays,setPays]=React.useState(D.payments);
  const cols=bp==='m'?1:3;
  const charge=p=>{setPays(ps=>ps.map(x=>x.id===p.id?{...x,status:'Cobrança enviada'}:x));toast({tone:'info',title:'Cobrança enviada',message:p.who+' · '+window.brl(p.value)});};
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat('+cols+',minmax(0,1fr))',gap:14}}>
      <Card><CardHeader title="Receita" subtitle="Mensal"/><Metric value="R$ 124K" size="lg" style={{marginTop:22}}/><div style={{fontSize:12,marginTop:8}}><span style={{color:'var(--green-500)'}}>+8,2%</span> vs setembro</div></Card>
      <Card><CardHeader title="Despesas" subtitle="Recorrentes"/><Metric value="R$ 31K" size="lg" style={{marginTop:22}}/><Legend direction="row" style={{marginTop:10}} items={[{label:'Condomínio',color:'var(--brand)'},{label:'Manutenção',color:'var(--ink-800)'},{label:'Taxas',color:'var(--gray-300)'}]}/></Card>
      <Card tone="brand"><CardHeader inverse title="A receber" subtitle="este mês"/><Metric inverse value="R$ 18,9K" size="lg" style={{marginTop:22}}/><div style={{marginTop:14}}><Switch checked={auto} onChange={v=>{setAuto(v);toast({tone:'neutral',title:v?'Cobrança automática ativada':'Cobrança automática desativada'});}} label={<span style={{color:'#fff',fontSize:13}}>Cobrança automática</span>}/></div></Card>
    </div>
    <Card><CardHeader title="Fluxo de caixa" subtitle="Análise" action={<SegmentedControl size="sm" options={['Dia','Semana','Mês']} value={r} onChange={setR}/>}/><LineChart height={bp==='m'?170:220} series={[{name:'Receita',color:'var(--ink-700)',data:D.revenue[r]}]} labels={['Jan','Mar','Mai','Jul','Set']} highlight={6} formatValue={v=><span>R$ {Math.round(v*100).toLocaleString('pt-BR')}<span style={{opacity:.55}}>,00</span></span>}/></Card>
    <Card padding={bp==='m'?14:20}><CardHeader title="Pagamentos" subtitle="Recentes" style={{marginBottom:10}}/>
      <DataTable columns={[{key:'who',label:'Inquilino',render:p=><div><div style={{color:'var(--text-strong)'}}>{p.who}</div><div style={{fontSize:12,color:'var(--text-muted)'}}>{p.unit}</div></div>},{key:'date',label:'Data'},{key:'value',label:'Valor',align:'right',render:p=>window.brl(p.value)},{key:'status',label:'Status',render:p=><Badge size="sm" dot tone={window.STATUS_TONE[p.status]||'soft'}>{p.status}</Badge>},{key:'a',label:'',align:'right',render:p=>p.status==='Atrasado'||p.status==='A vencer'?<Button size="sm" variant="secondary" onClick={()=>charge(p)}>Cobrar</Button>:null}]} rows={pays}/>
    </Card>
  </div>;
}
window.FinanceScreen=FinanceScreen;
})();

</script>
<script type="text/babel" data-source="App.jsx">
(function(){
const {Dialog,Button,Input,Select,Checkbox,Toast,SegmentedControl}=window.AlugaDesignSystem_e4b917;
function App(){
  const [authed,setAuthed]=React.useState(()=>localStorage.getItem('aluga_kit_auth')==='1');
  const [module,setModule]=React.useState(()=>localStorage.getItem('aluga_kit_module')||'dash');
  const [view,setView]=React.useState('overview');
  const [tasks,setTasks]=React.useState(window.ALUGA_DATA.tasks);
  const [adding,setAdding]=React.useState(false);const [draft,setDraft]=React.useState({title:'',where:'Ed. Aurora',urgent:false});
  const [toasts,setToasts]=React.useState([]);
  React.useEffect(()=>{localStorage.setItem('aluga_kit_module',module);window.scrollTo(0,0);},[module]);
  const toast=t=>{const id=Date.now()+Math.random();setToasts(x=>[...x,{...t,id}]);setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==id)),3200);};
  const login=()=>{localStorage.setItem('aluga_kit_auth','1');setAuthed(true);};
  const logout=()=>{localStorage.setItem('aluga_kit_auth','0');setAuthed(false);};
  const save=()=>{if(!draft.title.trim())return;setTasks(ts=>[{id:Date.now(),title:draft.title,where:draft.where,progress:5,tone:draft.urgent?'brand':'light',people:[{name:'Rodrigo Alves'}],status:draft.urgent?'Urgente':'Agendada',due:'—'},...ts]);setAdding(false);setDraft({title:'',where:'Ed. Aurora',urgent:false});toast({title:'Tarefa criada',message:'A equipe de manutenção foi notificada.'});};
  if(!authed)return <LoginScreen onLogin={login}/>;
  return <>
    <Shell module={module} setModule={setModule} view={view} setView={setView} onLogout={logout}>{bp=>{
      if(module==='dash')return <>{bp==='m'&&<SegmentedControl options={[{value:'overview',label:'Visão geral'},{value:'analytics',label:'Análises'}]} value={view} onChange={setView} style={{marginBottom:14,display:'flex'}}/>}{view==='analytics'?<AnalyticsScreen bp={bp}/>:<DashboardScreen bp={bp} tasks={tasks} onAddTask={()=>setAdding(true)} go={setModule}/>}</>;
      if(module==='props')return <PropertiesScreen bp={bp} toast={toast}/>;
      if(module==='maint')return <MaintenanceScreen bp={bp} tasks={tasks} setTasks={setTasks} onAddTask={()=>setAdding(true)} toast={toast}/>;
      return <FinanceScreen bp={bp} toast={toast}/>;
    }}</Shell>
    <Dialog open={adding} onClose={()=>setAdding(false)} title="Nova tarefa" subtitle="Manutenção" footer={<><Button variant="secondary" onClick={()=>setAdding(false)}>Cancelar</Button><Button onClick={save} disabled={!draft.title.trim()}>Salvar tarefa</Button></>}>
      <Input label="Título" variant="white" placeholder="Ex.: Troca do chuveiro" value={draft.title} onChange={v=>setDraft(d=>({...d,title:v}))}/>
      <Select label="Imóvel" options={['Ed. Aurora','Residencial Pinheiros','Casa Jardins','Vila Madalena Lofts']} value={draft.where} onChange={v=>setDraft(d=>({...d,where:v}))}/>
      <Checkbox checked={draft.urgent} onChange={v=>setDraft(d=>({...d,urgent:v}))} label="Marcar como urgente"/>
    </Dialog>
    <div style={{position:'fixed',right:16,bottom:96,display:'flex',flexDirection:'column',gap:10,zIndex:200,width:'min(380px,calc(100vw - 32px))'}}>{toasts.map(t=><Toast key={t.id} {...t} onClose={()=>setToasts(x=>x.filter(y=>y.id!==t.id))}/>)}</div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();

</script>
</body></html>
