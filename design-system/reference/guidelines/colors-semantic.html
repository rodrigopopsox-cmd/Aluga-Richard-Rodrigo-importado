<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:18px;padding:14px;height:96px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px}.sw b{font-weight:500;font-size:13px}.m{color:var(--text-muted)}</style></head><body><div class="r"><div class="sw" style="background:var(--green-500);color:#fff;"><b>--success</b><span style="opacity:.75">#22B722 · +12, 3 dias</span></div><div class="sw" style="background:var(--green-100);color:var(--green-600);"><b>--green-100</b><span style="opacity:.75">#E3F7E3</span></div><div class="sw" style="background:var(--red-500);color:#fff;"><b>--danger</b><span style="opacity:.75">#FF2D2D · counter</span></div><div class="sw" style="background:var(--red-100);color:var(--red-600);"><b>--red-100</b><span style="opacity:.75">#FFE5E5</span></div><div class="sw" style="background:var(--amber-500);color:#fff;"><b>--warning</b><span style="opacity:.75">#F5A524</span></div></div></body></html>
